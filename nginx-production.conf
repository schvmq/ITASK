# ==============================================================================
# ITASK Nginx Production Configuration
# Copy this file to: /etc/nginx/sites-available/itask
# Symlink: ln -s /etc/nginx/sites-available/itask /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with your domain or server IP

    root /var/www/itask/backend/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust version if using php8.3-fpm
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
