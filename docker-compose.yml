services:
  postgres:
    image: postgres:17-alpine
    container_name: itask-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-itask}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itask_dev_2026}
    volumes:
      - itask_pgdata:/var/lib/postgresql/data

volumes:
  itask_pgdata:
